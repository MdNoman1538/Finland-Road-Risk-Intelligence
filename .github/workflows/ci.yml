name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# A new push to the same branch cancels the now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Ruff lint
        run: uv run --frozen --only-group dev ruff check .

      - name: Ruff format check
        run: uv run --frozen --only-group dev ruff format --check .

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      - name: requirements.txt (used by Render) matches uv.lock
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --no-header -o /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest

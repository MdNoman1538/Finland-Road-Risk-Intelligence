[project]
name = "finland-road-risk"
version = "0.1.0"
description = "Context-aware road risk intelligence for Finland, evolving into an in-car alert system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.38.0",
    "folium>=0.17.0",
    "streamlit-folium>=0.22.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",      # required by FastAPI's TestClient
    "ruff>=0.17.6",
    "pre-commit>=4.0",
]

[tool.uv]
# This is an application, not a library: install dependencies only, don't build/install the project itself.
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Line length is enforced by `ruff format`; long string literals (e.g. translation tables) are allowed.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the DuckDB database file and the spatial extension",
]
